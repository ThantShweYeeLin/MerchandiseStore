# Add this location block inside the existing server { } block for your
# domain (the one that already has /content -> WordPress and /api -> Lab API).
# Do not touch those existing blocks — this just adds a new path.

location /store/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Preserve Authorization header for JWT bearer tokens
    proxy_pass_header Authorization;
}

# EduCore's inbound requests to our exposed peer endpoint land under the same
# /store/ path (e.g. /store/peer/students/:id/orders) — no extra block needed.
